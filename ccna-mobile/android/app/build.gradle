import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The display name lives in exactly one place — appName in capacitor.config.json,
// which Capacitor already owns. Gradle reads it from there and generates the string
// resources AndroidManifest points at, so renaming the brand is a one-word edit and
// the launcher label can never drift from the name the web layer uses.
def brandName = new JsonSlurper()
        .parse(rootProject.file("../capacitor.config.json"))
        .appName

// Version comes from CI: the tag becomes versionName, the run number becomes versionCode.
// Locally both fall back to something buildable, so `./gradlew assembleDebug` needs no setup.
def ciVersionCode = (System.getenv("VERSION_CODE") ?: "1") as Integer
def ciVersionName = System.getenv("VERSION_NAME") ?: "0.1.0-dev"

// Signing material never lives in the repo. CI writes keystore.properties next to this
// file from GitHub Secrets; without it, release builds stay unsigned and Gradle says so
// instead of failing halfway through.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.nickelface.ccnatrainer"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nickelface.ccnatrainer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciVersionCode
        versionName ciVersionName
        resValue "string", "app_name", brandName
        resValue "string", "title_activity_main", brandName
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey("storeFile")) {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        // A debug build installs next to the app you already use instead of replacing it.
        // The APK on the phone is signed with the CI keystore and a debug APK is not, so
        // with a shared applicationId Android refuses the update outright and the only way
        // in is uninstalling first — which takes the saved progress with it. The suffix
        // also moves the FileProvider authority (${applicationId}.fileprovider), which two
        // installed apps may not share.
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            // Marks which of the two installed apps is the test one, in the launcher.
            resValue "string", "app_name", "$brandName (test)"
            resValue "string", "title_activity_main", "$brandName (test)"
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps.containsKey("storeFile")) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle("keystore.properties not found — release build will be unsigned")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // No JUnit/Espresso: the logic that is worth testing lives in src/engine and is
    // covered by `npm test`. There is nothing on the Java side but an empty BridgeActivity.
}

apply from: 'capacitor.build.gradle'
