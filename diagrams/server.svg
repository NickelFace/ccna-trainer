<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Server</title>
  <desc>Server icon — blue tower with drive slots and indicator LEDs.</desc>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <rect x="40" y="24" width="40" height="72" rx="6" fill="#0b1530" stroke="#3b82f6" stroke-width="2.5"/>
  </g>
  <g stroke="#60a5fa" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="38" x2="70" y2="38"/>
    <line x1="50" y1="50" x2="70" y2="50"/>
    <line x1="50" y1="62" x2="70" y2="62"/>
  </g>
  <circle cx="50" cy="82" r="2.6" fill="#60a5fa"/>
  <circle cx="60" cy="82" r="2.6" fill="#60a5fa"/>
</svg>
