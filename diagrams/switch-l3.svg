<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
  <title>Switch L3</title>
  <desc>Layer 3 switch icon — teal, with L3 routing badge.</desc>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#14b8a6" flood-opacity="0.9"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <g filter="url(#glow)">
    <rect x="20" y="32" width="80" height="56" rx="6" fill="#07201d" stroke="#14b8a6" stroke-width="2.5"/>
  </g>
  <g stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="34" y1="50" x2="80" y2="50" marker-end="url(#arr)"/>
    <line x1="80" y1="62" x2="34" y2="62" marker-end="url(#arr)"/>
    <line x1="34" y1="74" x2="80" y2="74" marker-end="url(#arr)"/>
  </g>
  <rect x="74" y="26" width="28" height="16" rx="8" fill="#14b8a6"/>
  <text x="88" y="38" fill="#04241f" font-size="11" font-weight="bold" text-anchor="middle">L3</text>
</svg>
