<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetPath · тренажёр для экзамена 200-301</title>
<meta name="description" content="Независимый тренажёр для подготовки к экзамену 200-301: попытки взвешены по шести официальным доменам, drag-and-drop, отчёт по доменам.">
<!-- The tab icon is the launcher mark on its ink plate, not the bare glyph: a tab strip
     can be light or dark and the plate carries its own contrast either way. SVG first,
     PNG for the browsers that still ignore it. Generated by brand/generate.py. -->
<link rel="icon" href="assets/icons/favicon.svg?v=1" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png?v=1" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=1">
<!-- The dashboard paints while the question bank is still being fetched, so its heading
     and UI faces are the only render-blocking assets worth preloading. Cyrillic first:
     the site is Russian by default and the Latin subsets are only pulled in for EN. -->
<link rel="preload" href="assets/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/playfair-display-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/styles.css?v=38">
</head>
<body>
<!-- The shell app.js draws into: the sidebar is redrawn on every screen change, the screen
     itself replaces #trainer. Both are painted before the 3 MB bank lands. -->
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="wrap" id="trainer">
      <h1>CCNA 200-301</h1>
      <div class="sub">Загрузка банка вопросов…</div>
    </div>
  </main>
</div>
<!-- The progress store is a module: it imports the rules shared with the Android app
     (assets/js/shared/). Module scripts are deferred, so it has run and set window.Store
     before app.js routes on DOMContentLoaded. -->
<script type="module" src="assets/js/store.js?v=22"></script>
<script src="assets/js/app.js?v=58"></script>
</body>
</html>
