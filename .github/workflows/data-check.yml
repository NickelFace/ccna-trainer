name: Check question bank

# The bank is the one thing both the web app and the Android app read, and it is
# regenerated by build/build_data.py rather than edited by hand. This runs the engine's
# own suite against it: keys that point at options that do not exist, drag-and-drop items
# that no bucket can match, exhibits referenced but missing from disk, and the domain
# counts meta.json advertises.
on:
  push:
    branches: ["main"]
    paths:
      - "ccna-exam-simulator/data/**"
      - "ccna-exam-simulator/images/exhibits/**"
      - "ccna-exam-simulator/assets/js/**"
      - "ccna-mobile/src/engine/**"
      - "ccna-mobile/tests/**"
      - "ccna-book/**"
      - ".github/workflows/data-check.yml"
  pull_request:
    paths:
      - "ccna-exam-simulator/data/**"
      - "ccna-exam-simulator/images/exhibits/**"
      - "ccna-exam-simulator/assets/js/**"
      - "ccna-mobile/**"
      - "ccna-book/**"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccna-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ccna-mobile/package-lock.json

      # The tests import only the engine and read the bank off disk, so nothing has to be
      # built and the whole check finishes in seconds.
      - name: Install deps
        run: npm ci

      - name: Run engine and bank tests
        run: npm test

      # The site has no build step: Pages serves ccna-exam-simulator/data/theory/ exactly
      # as committed. A chapter edited without rebuilding would therefore be current in
      # the APK (which builds the book on every release) and stale on the site — the same
      # class of drift the shared engine modules were moved to one place to avoid. So:
      # rebuild into a temp directory and insist the committed copy is identical.
      - name: Textbook build is committed
        working-directory: .
        run: |
          node ccna-book/build.mjs --out "$RUNNER_TEMP/theory" > /dev/null
          diff -r "$RUNNER_TEMP/theory" ccna-exam-simulator/data/theory \
            || { echo "::error::data/theory is stale — run: node ccna-book/build.mjs --out ccna-exam-simulator/data/theory"; exit 1; }
