name: Check question bank

# The bank is the one thing both the web app and the Android app read, and it is
# regenerated by build/build_data.py rather than edited by hand. This runs the engine's
# own suite against it: keys that point at options that do not exist, drag-and-drop items
# that no bucket can match, exhibits referenced but missing from disk, and the domain
# counts meta.json advertises.
on:
  push:
    branches: ["main"]
    paths:
      - "ccna-exam-simulator/data/**"
      - "ccna-exam-simulator/images/exhibits/**"
      - "ccna-mobile/src/engine/**"
      - "ccna-mobile/tests/**"
      - ".github/workflows/data-check.yml"
  pull_request:
    paths:
      - "ccna-exam-simulator/data/**"
      - "ccna-exam-simulator/images/exhibits/**"
      - "ccna-mobile/**"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccna-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ccna-mobile/package-lock.json

      # The tests import only the engine and read the bank off disk, so nothing has to be
      # built and the whole check finishes in seconds.
      - name: Install deps
        run: npm ci

      - name: Run engine and bank tests
        run: npm test
