name: Build Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "ccna-exam-simulator/**"
      - ".github/workflows/android-build.yml"
      - "!ccna-exam-simulator/ccna-trainer.apk"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccna-exam-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        run: npm ci

      - name: Sync web assets into www/
        run: npm run sync-www

      - name: Capacitor sync (copy www into android project)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ccna-exam-simulator/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK (build artifact, 90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: ccna-trainer-debug-apk
          path: ccna-exam-simulator/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ccna-trainer-build-${{ github.run_number }}.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }} (${{ github.sha }})"
          body: ${{ github.event.head_commit.message || format('Manual build via workflow_dispatch ({0})', github.sha) }}
          make_latest: true
          files: ccna-exam-simulator/ccna-trainer-build-${{ github.run_number }}.apk
