name: Release Android app

# Tag a release to ship it:  git tag v1.2 && git push origin v1.2
#
# versionName comes from the tag, versionCode from the run number — monotonic, which is
# what Play requires, and it never collides with a locally built APK (those stay at 1).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccna-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ccna-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      # The engine tests also validate the bank the build is about to package, so a broken
      # key or a missing exhibit stops the release instead of shipping.
      - name: Test
        run: npm test

      - name: Build web bundle and sync
        run: npm run android

      # Written from secrets, never committed. Without these the release build still runs
      # and produces an unsigned artifact, which is useful for a dry run.
      - name: Restore keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build AAB and APK
        working-directory: ccna-mobile/android
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}-dev', github.run_number) }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Remove signing material
        if: always()
        run: rm -f android/release.jks android/keystore.properties

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccna-trainer-${{ github.ref_name }}
          path: |
            ccna-mobile/android/app/build/outputs/bundle/release/*.aab
            ccna-mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ccna-mobile/android/app/build/outputs/bundle/release/*.aab
            ccna-mobile/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
