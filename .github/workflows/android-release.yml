name: Release Android app

# Every push to main that touches the app or the question bank publishes a new release
# and deletes the previous ones, so there is always exactly one build to download.
#
# Versioning: BASE_VERSION is the release line. The first run on a line publishes it
# verbatim (2.0), every run after that adds a patch number (2.0.1, 2.0.2, …). To start a
# new line, bump BASE_VERSION and set RUN_OFFSET to the run number of that first build —
# the run counter is per-workflow-file and never resets.
#
# versionCode must never go backwards, or Android refuses the update with
# INSTALL_FAILED_VERSION_DOWNGRADE on every device that already has a newer one installed.
# It's derived from the run number (monotonic, which is all Android requires) plus
# CODE_OFFSET. The run counter is per-workflow-file: if this file is ever renamed, the
# counter resets to 1. Before renaming, bump CODE_OFFSET to (last published versionCode -
# next run's number) so the sequence keeps climbing across the rename.
on:
  push:
    branches: ["main"]
    paths:
      - "ccna-mobile/**"
      - "ccna-book/**"
      - "ccna-exam-simulator/data/**"
      - "ccna-exam-simulator/images/exhibits/**"
      # The app bundles the rules it shares with the web trainer (srs, scale, activity,
      # save format) straight from there — a fix in one of those files changes the APK.
      - "ccna-exam-simulator/assets/js/shared/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BASE_VERSION: "2.0"
  RUN_OFFSET: 1
  CODE_OFFSET: 0

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccna-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ccna-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Work out the version
        id: version
        run: |
          patch=$(( ${{ github.run_number }} - ${{ env.RUN_OFFSET }} ))
          if [ "$patch" -le 0 ]; then
            name="${BASE_VERSION}"
          else
            name="${BASE_VERSION}.${patch}"
          fi
          code=$(( ${{ github.run_number }} + ${{ env.CODE_OFFSET }} ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Publishing $name (versionCode $code)"

      - name: Install deps
        run: npm ci

      # The engine tests also validate the bank this build is about to package, so a broken
      # answer key or a missing exhibit stops the release instead of shipping.
      - name: Test
        run: npm test

      - name: Build web bundle and sync
        run: npm run android

      # Written from secrets, never committed, removed again below. Without them there is
      # no signing key, so the build stops here instead of quietly publishing a
      # debug-signed APK (a one-off throwaway key) as if it were the real release.
      - name: Restore keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to publish an unsigned release. Add the ANDROID_KEYSTORE_* secrets."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release (AAB + APK)
        working-directory: ccna-mobile/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Remove signing material
        if: always()
        run: rm -f android/release.jks android/keystore.properties

      - name: Collect artifacts
        run: |
          mkdir -p out
          v="${{ steps.version.outputs.name }}"
          cp android/app/build/outputs/apk/release/*.apk "out/ccna-trainer-$v.apk"
          cp android/app/build/outputs/bundle/release/*.aab "out/ccna-trainer-$v.aab"
          ls -lh out

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ccna-trainer-${{ steps.version.outputs.name }}
          path: ccna-mobile/out/*
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          body: |
            ${{ github.event.head_commit.message || format('Manual build ({0})', github.sha) }}

            ---
            versionCode ${{ steps.version.outputs.code }} · commit ${{ github.sha }}
            Signed release build (minified).
          make_latest: true
          files: ccna-mobile/out/*

      # One release at a time: the new build just published above, so anything else on
      # this app's vX.Y[.Z] tag scheme is a stale predecessor. Runs after publish so a
      # failed publish leaves the previous release in place instead of an empty repo.
      # Filtered to that tag pattern so unrelated releases in this repo are never touched.
      - name: Delete previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_tag="v${{ steps.version.outputs.name }}"
          # grep exits 1 with no matches, which would kill this step under pipefail —
          # `|| true` only on the very first run, before any app release exists.
          old_tags=$(gh release list --repo ${{ github.repository }} --limit 200 --json tagName -q '.[].tagName' \
            | grep -E '^v[0-9]+(\.[0-9]+)*$' || true)
          echo "$old_tags" | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$new_tag" ]; then
              echo "Deleting old release $tag"
              gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
            fi
          done
